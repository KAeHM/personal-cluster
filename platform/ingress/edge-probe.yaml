apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-probe
  namespace: edge-system
spec:
  replicas: 2
  selector:
    matchLabels: { app: edge-probe }
  template:
    metadata:
      labels: { app: edge-probe }
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: personal.platform/edge
                    operator: In
                    values: ["true"]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: edge-probe }
          matchLabelKeys: [pod-template-hash]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: http-echo
          image: docker.io/hashicorp/http-echo@sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186
          args: [-listen=:5678, -text=ok]
          ports:
            - { name: http, containerPort: 5678 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: edge-probe
  namespace: edge-system
spec:
  selector: { app: edge-probe }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edge-probe
  namespace: edge-system
  annotations:
    external-dns.kaehm.dev/publish: "true"
    external-dns.kubernetes.io/ttl: "60"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - probe.kaehm.dev
      secretName: probe-kaehm-dev-tls
  rules:
    - host: probe.kaehm.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edge-probe
                port:
                  name: http
