apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: personal-platform
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: personal-platform.gitops
      rules:
        - alert: ArgoApplicationOutOfSync
          expr: max by (name, namespace, project) (argocd_app_info{sync_status!="Synced"}) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Aplicação do Argo CD fora de sincronia
            description: 'A aplicação {{ $labels.name }} está fora de sincronia há mais de 15 minutos.'
        - alert: ArgoApplicationUnhealthy
          expr: max by (name, namespace, project, health_status) (argocd_app_info{health_status!~"Healthy|Progressing"}) > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Aplicação do Argo CD sem saúde
            description: 'A aplicação {{ $labels.name }} está no estado {{ $labels.health_status }}.'
    - name: personal-platform.storage
      rules:
        - alert: PersistentVolumeAlmostFull
          expr: 100 * kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Volume persistente quase cheio
            description: 'O volume {{ $labels.persistentvolumeclaim }} no namespace {{ $labels.namespace }} ultrapassou 85% de uso.'
