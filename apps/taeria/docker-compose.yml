# App Next.js — usa credenciais do Supabase Cloud em .env.local.
# Suba com: docker compose up -d

services:
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - .env.local
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
