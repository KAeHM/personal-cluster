AWSTemplateFormatVersion: "2010-09-09"
Description: Recuperacao externa do K3s pessoal
Parameters:
  ClusterName:
    Type: String
    Default: personal-contabo
    AllowedPattern: "[a-z0-9-]+"
Resources:
  SnapshotBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-etcd-snapshots
            Status: Enabled
            Prefix: etcd/
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          - Id: expire-taeria-postgres-backups
            Status: Enabled
            Prefix: postgres/taeria/
            ExpirationInDays: 21
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
  SnapshotUploader:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub "${ClusterName}-etcd-uploader"
      Policies:
        - PolicyName: upload-etcd-snapshots
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # K3s validates the dedicated bucket with HeadBucket before upload.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SnapshotBucket.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${SnapshotBucket.Arn}/etcd/*"
  TaeriaBackupUploader:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub "${ClusterName}-taeria-postgres-backup"
      Policies:
        - PolicyName: manage-taeria-postgres-backups
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Barman validates the destination with HeadBucket. AWS maps that
              # request to ListBucket, so it cannot carry an s3:prefix condition.
              - Sid: InspectTaeriaBackupBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                Resource: !GetAtt SnapshotBucket.Arn
              - Sid: ManageTaeriaBackupObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                  - s3:DeleteObject
                Resource: !Sub "${SnapshotBucket.Arn}/postgres/taeria/*"
Outputs:
  BucketName:
    Value: !Ref SnapshotBucket
  UploaderUserName:
    Value: !Ref SnapshotUploader
  TaeriaBackupUploaderUserName:
    Value: !Ref TaeriaBackupUploader
  RecommendedServerTokenParameter:
    Value: !Sub "/personal/platform/${ClusterName}/k3s/server-token"
