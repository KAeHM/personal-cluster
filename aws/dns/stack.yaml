AWSTemplateFormatVersion: "2010-09-09"
Description: Acesso minimo do cluster pessoal ao DNS publico no Route 53
Parameters:
  HostedZoneId:
    Type: String
    AllowedPattern: "^Z[A-Z0-9]+$"
    Description: ID da hosted zone publica, sem o prefixo /hostedzone/
  BaseDomain:
    Type: String
    Default: kaehm.dev
    AllowedPattern: "^[a-z0-9.-]+$"
    Description: Dominio normalizado sem ponto final
Resources:
  ExternalDnsUser:
    Type: AWS::IAM::User
    Properties:
      UserName: personal-contabo-external-dns
      Policies:
        - PolicyName: ManagePublishedApplicationRecords
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ChangeApplicationRecords
                Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub "arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}"
                Condition:
                  ForAllValues:StringLike:
                    route53:ChangeResourceRecordSetsNormalizedRecordNames:
                      - !Sub "*.${BaseDomain}"
                  ForAllValues:StringEquals:
                    route53:ChangeResourceRecordSetsActions: [CREATE, UPSERT]
                    route53:ChangeResourceRecordSetsRecordTypes: [A, AAAA, CNAME, TXT]
              - Sid: InspectManagedZone
                Effect: Allow
                Action:
                  - route53:ListResourceRecordSets
                  - route53:ListTagsForResources
                Resource: !Sub "arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}"
              - Sid: DiscoverHostedZones
                Effect: Allow
                Action: route53:ListHostedZones
                Resource: "*"
  CertManagerUser:
    Type: AWS::IAM::User
    Properties:
      UserName: personal-contabo-cert-manager
      Policies:
        - PolicyName: SolveDns01Challenges
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ObserveChallengeChanges
                Effect: Allow
                Action: route53:GetChange
                Resource: !Sub "arn:${AWS::Partition}:route53:::change/*"
              - Sid: ChangeAcmeTxtRecords
                Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub "arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}"
                Condition:
                  ForAllValues:StringLike:
                    route53:ChangeResourceRecordSetsNormalizedRecordNames:
                      - !Sub "_acme-challenge*.${BaseDomain}"
                  ForAllValues:StringEquals:
                    route53:ChangeResourceRecordSetsActions: [CREATE, UPSERT, DELETE]
                    route53:ChangeResourceRecordSetsRecordTypes: [TXT]
              - Sid: InspectChallengeRecords
                Effect: Allow
                Action: route53:ListResourceRecordSets
                Resource: !Sub "arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}"
Outputs:
  ExternalDnsUserName:
    Value: !Ref ExternalDnsUser
  CertManagerUserName:
    Value: !Ref CertManagerUser
