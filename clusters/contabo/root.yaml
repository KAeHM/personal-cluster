apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: personal-platform-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/KAeHM/personal-cluster.git
    targetRevision: main
    path: clusters/contabo/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
