apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 13.4.0
    helm:
      releaseName: grafana
      valuesObject:
        replicas: 1
        service:
          type: ClusterIP
        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            external-dns.kaehm.dev/publish: "true"
            external-dns.kubernetes.io/ttl: "60"
            cert-manager.io/cluster-issuer: letsencrypt-prod
          hosts:
            - grafana.kaehm.dev
          tls:
            - secretName: grafana-kaehm-dev-tls
              hosts:
                - grafana.kaehm.dev
        persistence:
          enabled: true
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          size: 5Gi
        resources:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { cpu: 500m, memory: 768Mi }
        grafana.ini:
          server:
            root_url: https://grafana.kaehm.dev
          analytics:
            reporting_enabled: false
            check_for_updates: false
          security:
            disable_gravatar: true
            cookie_secure: true
            cookie_samesite: strict
            strict_transport_security: true
          users:
            allow_sign_up: false
          auth.anonymous:
            enabled: false
        sidecar:
          dashboards:
            enabled: true
            label: grafana_dashboard
            labelValue: "1"
            searchNamespace: ALL
            provider:
              allowUiUpdates: false
              foldersFromFilesStructure: true
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                uid: prometheus
                type: prometheus
                access: proxy
                url: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
                isDefault: true
                editable: false
                jsonData:
                  httpMethod: POST
                  exemplarTraceIdDestinations:
                    - name: trace_id
                      datasourceUid: tempo
              - name: Loki
                uid: loki
                type: loki
                access: proxy
                url: http://loki-gateway.monitoring.svc.cluster.local
                editable: false
                jsonData:
                  derivedFields:
                    - name: TraceID
                      matcherRegex: '"trace_id"\s*:\s*"([a-f0-9]+)"'
                      datasourceUid: tempo
                      url: '$${__value.raw}'
              - name: Tempo
                uid: tempo
                type: tempo
                access: proxy
                url: http://tempo.monitoring.svc.cluster.local:3200
                editable: false
                jsonData:
                  httpMethod: GET
                  nodeGraph:
                    enabled: true
                  serviceMap:
                    datasourceUid: prometheus
                  tracesToLogsV2:
                    datasourceUid: loki
                    spanStartTimeShift: -5m
                    spanEndTimeShift: 5m
                    filterByTraceID: true
                    filterBySpanID: false
                  tracesToMetrics:
                    datasourceUid: prometheus
                    spanStartTimeShift: -5m
                    spanEndTimeShift: 5m
                    queries:
                      - name: Taxa de requisições
                        query: 'sum(rate(traces_spanmetrics_calls_total{$$__tags}[5m]))'
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
