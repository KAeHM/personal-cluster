apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dns-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://github.com/KAeHM/personal-cluster.git
    targetRevision: main
    path: platform/dns
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
