name: Deploy Personal Assistence Web

on:
  push:
    branches:
      - master
    paths:
      - "apps/personal-assistence/web/**"
      - ".github/workflows/personal-assistence-deploy.yaml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/kaehm/personal-cluster/personal-assistence-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/personal-assistence/web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Kubernetes manifests
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          sed -i "s|image: ghcr.io/kaehm/personal-cluster/personal-assistence-web:.*|image: ${{ env.IMAGE_NAME }}:${SHORT_SHA}|g" infra/personal-assistence/web-app.yaml

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(personal-assistence): update web-app image to ${GITHUB_SHA::7}"
          file_pattern: infra/personal-assistence/web-app.yaml
