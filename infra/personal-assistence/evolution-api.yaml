apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evolution-instances
  namespace: personal-assistence
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: evolution-api
  namespace: personal-assistence
spec:
  selector:
    app: evolution-api
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evolution-api
  namespace: personal-assistence
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evolution-api
  template:
    metadata:
      labels:
        app: evolution-api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres.personal-assistence.svc.cluster.local -p 5432 -U admin; do sleep 2; done
      containers:
        - name: evolution-api
          image: evoapicloud/evolution-api:2.4.0-rc2
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_URL
              value: https://evolution-personal-assistence.tail412374.ts.net
            - name: AUTHENTICATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: EVOLUTION_API_KEY
            - name: DATABASE_ENABLED
              value: "true"
            - name: DATABASE_PROVIDER
              value: postgresql
            - name: DATABASE_CONNECTION_URI
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: EVOLUTION_DATABASE_URL
            - name: DATABASE_CONNECTION_CLIENT_NAME
              value: evolution
            - name: CACHE_REDIS_ENABLED
              value: "false"
            - name: WEBHOOK_GLOBAL_ENABLED
              value: "false"
            - name: CONFIG_SESSION_PHONE_CLIENT
              value: Chrome
            - name: CONFIG_SESSION_PHONE_NAME
              value: Chrome
            - name: CONFIG_SESSION_PHONE_VERSION
              valueFrom:
                configMapKeyRef:
                  name: evolution-config
                  key: WHATSAPP_WEB_VERSION
            - name: QRCODE_LIMIT
              value: "30"
            - name: LOG_LEVEL
              value: ERROR
            - name: WPP_LID_MODE
              value: "false"
          volumeMounts:
            - name: evolution-instances
              mountPath: /evolution/instances
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: evolution-instances
          persistentVolumeClaim:
            claimName: evolution-instances
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: evolution-config
  namespace: personal-assistence
data:
  WHATSAPP_WEB_VERSION: "2.3000.1040753655.261600"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: evolution-api-ingress
  namespace: personal-assistence
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - evolution-personal-assistence.tail412374.ts.net
  rules:
    - host: evolution-personal-assistence.tail412374.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: evolution-api
                port:
                  number: 8080
