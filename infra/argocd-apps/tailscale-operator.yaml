apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
spec:
  project: default
  source:
    chart: tailscale-operator
    repoURL: https://pkgs.tailscale.com/helmcharts
    targetRevision: 1.66.4
    helm:
      values: |
        oauth:
          clientId: "kUM4ybamxY11CNTRL"
          clientSecret: "tskey-client-kUM4ybamxY11CNTRL-VXFwMELghnNsxyho3kBgnNv4p9D7VR5Fc"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
