apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    chart: grafana
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 7.3.0
    helm:
      values: |
        adminPassword: "admin"
        persistence:
          enabled: true
          size: 5Gi
        ingress:
          enabled: true
          ingressClassName: tailscale
          hosts:
            - grafana.tail412374.ts.net
          tls:
            - hosts:
                - grafana.tail412374.ts.net
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
            - name: Prometheus
              type: prometheus
              uid: prometheus
              url: http://prometheus-server.monitoring.svc.cluster.local:80
              access: proxy
              isDefault: true
            - name: Loki
              type: loki
              uid: loki
              url: http://loki.monitoring.svc.cluster.local:3100
              access: proxy
              jsonData:
                httpHeaderName1: 'X-Scope-OrgID'
                timeout: 60
              secureJsonData:
                httpHeaderValue1: '1'
            - name: Tempo
              type: tempo
              uid: tempo
              url: http://tempo.monitoring.svc.cluster.local:3200
              access: proxy
              jsonData:
                tracesToLogsV2:
                  datasourceUid: loki
                  spanStartTimeShift: -1h
                  spanEndTimeShift: 1h
                  filterByTraceID: true
                  filterBySpanID: false
                lokiSearch:
                  datasourceUid: loki
                serviceMap:
                  datasourceUid: prometheus
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
