apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: personal-assistence
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/KAeHM/personal-cluster
    targetRevision: master
    path: infra/personal-assistence
  destination:
    server: https://kubernetes.default.svc
    namespace: personal-assistence
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
