apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: custom-manifests
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/KAeHM/personal-cluster"
    targetRevision: master
    path: infra/custom-manifests
  destination:
    server: "https://kubernetes.default.svc"
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
