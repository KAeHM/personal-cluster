apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    chart: loki
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 6.2.0
    helm:
      values: |
        loki:
          auth_enabled: false 
          useTestSchema: true
          commonConfig:
            replication_factor: 1
          storage:
            type: 'filesystem'
        test:
          enabled: false


        memcached:
          chunk_cache:
            enabled: false
          write_dedupe_cache:
            enabled: false
          index_queries_cache_enabled: false
          frontend_cache:
            enabled: false
        deploymentMode: SingleBinary
        singleBinary:
          replicas: 1
        simpleScalable:
          enabled: false
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
